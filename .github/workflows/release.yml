name: Build and Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release-contract-a:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Cyberbrawl Forge contract release'
      home_domain: 'cyberbrawl.io'
      relative_path: stellar/forge
      package: 'forge'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
  release-contract-b:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Cyberbrawl Beam contract release'
      home_domain: 'cyberbrawl.io'
      relative_path: stellar/beam
      package: 'beam'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
